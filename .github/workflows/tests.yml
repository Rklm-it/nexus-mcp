name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Сторожа сверяют хаб с кодом панели и ноды (инвариант 25 vgx3d):
      # без клона они падают, а не пропускаются. vgx3d приватный — нужен
      # секрет VGX3D_TOKEN (fine-grained PAT: vgx3d, Contents: read).
      - name: Клон vgx3d (только нужные каталоги)
        env:
          VGX3D_TOKEN: ${{ secrets.VGX3D_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [ -z "$VGX3D_TOKEN" ]; then
            echo "::error::нет секрета VGX3D_TOKEN — vgx3d приватный, сторожам не с чем сверять хаб"
            exit 1
          fi
          git clone -q --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${VGX3D_TOKEN}@github.com/Rklm-it/vgx3d.git" ../vgx3d
          git -C ../vgx3d sparse-checkout set brain/app cell admin_app/android/app/src/main/kotlin/ru/nexusflow/admin/chat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
        env:
          NEXUS_REPO_DIR: ${{ github.workspace }}/../vgx3d
      - name: Пробник — Python 3.8 (роутеры, старые Windows)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m py_compile probe/probe.py && python probe/probe.py --help >/dev/null
      - run: bash -n install.sh
